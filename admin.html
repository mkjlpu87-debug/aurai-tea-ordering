<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Admin</title><link rel="stylesheet" href="/style.css"></head><body><header><div><small>SHOP MANAGEMENT</small><h1>Admin panel</h1><p>Manage categories, products and prices</p></div><a href="/">Customer site ↗</a></header><main class="admin"><section id="login" class="panel"><h2>Admin login</h2><form id="loginForm"><input id="user" value="admin" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button class="save">Login</button></form><p id="loginMsg" class="msg"></p></section><div id="dash" class="hide"><section class="panel"><h2>Add category</h2><form id="catForm"><input id="catName" placeholder="Category name" maxlength="40" required><button class="save">Add category</button></form><div id="catList"></div></section><section class="panel"><h2>Add menu item</h2><form id="prodForm"><input id="prodName" placeholder="Product name" required maxlength="60"><select id="prodCat"></select><input id="prodPrice" type="number" min="0" step="1" placeholder="Price ₹" required><input id="prodDesc" placeholder="Description"><button class="save">Add item</button></form></section><section class="panel"><h2>Products</h2><div id="prodList"></div></section><button id="logout">Logout</button></div></main><script src="/admin.js"></script></body></html>
